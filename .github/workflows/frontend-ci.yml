name: Frontend CI Testing

on:
  push:
    branches: ["*"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  test-frontend:
    name: Test React Frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "23"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: Check coverage threshold
        working-directory: ./frontend
        run: |
          npx vitest run --coverage.enabled --coverage.reporter=json-summary

          # Extract coverage percentage from the summary and check against threshold
          COVERAGE=$(cat ./coverage/coverage-summary.json | jq '.total.statements.pct')

          if (( $(echo "$COVERAGE < 25" | bc -l) )); then
            echo "Coverage is below threshold: $COVERAGE% < 25%"
            exit 1
          else
            echo "Coverage threshold met: $COVERAGE% >= 25%"
          fi

      - name: Upload coverage reports to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage
          path: ./frontend/coverage/
          retention-days: 5
