name: CI Testing and Coverage

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Test Go Backend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.2"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          total_coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          if (( $(echo "$total_coverage < 0" | bc -l) )); then
            echo "Coverage is below threshold: $total_coverage% < 0%"
            exit 1
          else
            echo "Coverage threshold met: $total_coverage% >= 0%"
          fi

      - name: Upload coverage to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: coverage.out
          retention-days: 5

  test-frontend:
    name: Test React Frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "23"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        working-directory: ./frontend # Update this path if your frontend is in a different directory
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./frontend # Update this path if needed
        run: npm test -- --coverage

      - name: Check coverage threshold
        working-directory: ./frontend # Update this path if needed
        run: |
          npx vitest run --coverage.enabled --coverage.reporter=json-summary

          # Extract coverage percentage from the summary and check against threshold
          COVERAGE=$(cat ./coverage/coverage-summary.json | jq '.total.statements.pct')

          if (( $(echo "$COVERAGE < 25" | bc -l) )); then
            echo "Coverage is below threshold: $COVERAGE% < 25%"
            exit 1
          else
            echo "Coverage threshold met: $COVERAGE% >= 25%"
          fi

      - name: Upload coverage reports to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage
          path: ./frontend/coverage/
          retention-days: 5
